<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#53FC18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.93 19.07A10 10 0 0 1 2 12a10 10 0 0 1 2.93-7.07" />
            <path d="M19.07 4.93A10 10 0 0 1 22 12a10 10 0 0 1-2.93 7.07" />
            <path d="M7.76 16.24A6 6 0 0 1 6 12a6 6 0 0 1 1.76-4.24" />
            <path d="M16.24 7.76A6 6 0 0 1 18 12a6 6 0 0 1-1.76 4.24" />
            <circle cx="12" cy="12" r="2.5" fill="#53FC18" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Streamer Monitor</h1>
          <span id="headerLiveCounter" class="live-counter-badge">0 Live</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="popoutButton" class="icon-button" title="Open in separate window" aria-label="Popout window">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button id="refreshButton" class="icon-button" title="Refresh all streamers" aria-label="Refresh">
          <svg class="icon-svg refresh-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
        <button id="settingsToggle" class="icon-button" title="Settings" aria-label="Settings">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="circuitBanner" class="circuit-banner hidden" role="alert">
      <div class="circuit-banner-content">
        <svg class="circuit-banner-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span id="circuitBannerText" class="circuit-banner-text">Stream API temporarily throttled. Polling paused.</span>
      </div>
      <button id="circuitRetryBtn" class="circuit-retry-btn" type="button">Retry</button>
    </div>

    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-header">
        <h2 class="settings-title">Monitoring Settings</h2>
        <button id="settingsClose" class="icon-button small" aria-label="Close settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <div class="setting-label-group">
            <label for="checkIntervalSelect" class="setting-label">Poll Frequency</label>
            <span class="setting-hint warning-hint">⚠️ &lt; 5 mins may trigger rate limits</span>
          </div>
          <select id="checkIntervalSelect" class="select-input">
            <option value="1">⚠️ 1 min (High rate-limit risk)</option>
            <option value="2">⚠️ 2 mins (Frequent)</option>
            <option value="5">5 mins (Recommended)</option>
            <option value="10">10 mins</option>
            <option value="15">15 mins</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="sortBySelect" class="setting-label">Sort Order</label>
          <select id="sortBySelect" class="select-input">
            <option value="viewers">Viewers (High to Low)</option>
            <option value="alphabetical">Alphabetical (A–Z)</option>
            <option value="uptime">Stream Uptime</option>
            <option value="recent">Recently Checked</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="uiScaleSelect" class="setting-label">UI Zoom</label>
          <select id="uiScaleSelect" class="select-input">
            <option value="100">100% (Default)</option>
            <option value="110">110% (Medium)</option>
            <option value="120">120% (Large)</option>
            <option value="130">130% (Extra Large)</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">Desktop Notifications</span>
          <label class="toggle-switch">
            <input type="checkbox" id="notificationsToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Live Badge Counter</span>
          <label class="toggle-switch">
            <input type="checkbox" id="badgeToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <details class="settings-group" id="debugDropdown">
          <summary class="settings-group-header">
            <span class="setting-label">Debugging</span>
            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </summary>
          <div class="settings-group-content">
            <div class="setting-row">
              <span class="setting-label">Debug Logging</span>
              <label class="toggle-switch">
                <input type="checkbox" id="debugLoggingToggle">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="setting-row">
              <span class="setting-label">Test Notification</span>
              <button type="button" id="debugLiveNotifBtn" class="setting-btn">Test</button>
            </div>
          </div>
        </details>
      </div>
    </div>

    <form id="addStreamerForm" class="add-form">
      <div class="input-group">
        <div class="input-wrapper">
          <input
            type="text"
            id="streamerInput"
            class="text-input"
            placeholder="Enter channel slug or URL"
            autocomplete="off"
            spellcheck="false"
            required
          >
          <div id="searchDropdown" class="search-dropdown hidden"></div>
        </div>
        <button type="submit" id="addStreamerButton" class="button-primary">
          <span class="button-text">Track</span>
          <span class="button-spinner hidden"></span>
        </button>
      </div>
      <div id="formFeedback" class="feedback-banner hidden" role="alert"></div>
    </form>

    <nav class="filter-nav" aria-label="Streamer filters">
      <button class="filter-tab active" data-filter="all" id="filterAll">
        All <span class="filter-count" id="countAll">0</span>
      </button>
      <button class="filter-tab" data-filter="live" id="filterLive">
        Live <span class="filter-count live-pill" id="countLive">0</span>
      </button>
      <button class="filter-tab" data-filter="offline" id="filterOffline">
        Offline <span class="filter-count" id="countOffline">0</span>
      </button>
    </nav>

    <main class="streamers-container" id="streamersList" aria-live="polite">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Loading streamers...</p>
      </div>
    </main>

    <footer class="footer">
      <a href="#" id="privacyLink" class="footer-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>Privacy & Disclaimer
      </a>
      <span id="lastUpdatedTime" class="footer-time"></span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
